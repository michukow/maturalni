<style>
/* Layout: one narrow column like a school worksheet; the test is one question per screen, the result is a stacked report card. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#14201C; --muted:#56655F; --line:#D5DFDB;
  --accent:#1E6B57; --accent-soft:#DCEDE6; --mark:#B97A12; --mark-soft:#F6E8CC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E5EDEA; --muted:#93A49D; --line:#2B3934;
  --accent:#55C2A0; --accent-soft:#1B3A31; --mark:#E2A847; --mark-soft:#3A2E17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E5EDEA; --muted:#93A49D; --line:#2B3934;
  --accent:#55C2A0; --accent-soft:#1B3A31; --mark:#E2A847; --mark-soft:#3A2E17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:700;letter-spacing:-0.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* intro */
.intro{display:flex;flex-direction:column;gap:20px}
.intro .lead{font-size:1.12rem}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0;padding:0;list-style:none}
.stages li{border-top:3px solid var(--accent);padding-top:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stages li.s2{border-top-color:var(--mark)}
.stages b{font-family:var(--display);font-size:1.05rem}
.note{font-size:.9rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}

/* quiz */
.progress{display:flex;flex-direction:column;gap:8px}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:26px}
.qtext{font-family:var(--display);font-size:clamp(1.3rem,4.2vw,1.75rem);font-weight:500;line-height:1.25;text-wrap:balance}
.qtext .stem{display:block;font-size:.95rem;color:var(--muted);font-family:var(--body);margin-bottom:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.opt .n{font-family:var(--mono);font-size:1.2rem}
.opt .l{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.2;min-height:2.4em}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt[aria-pressed="true"] .l{color:var(--bg)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kbd{font-size:.8rem;color:var(--muted)}

/* results */
.section{display:flex;flex-direction:column;gap:16px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.bar .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.bar .name{font-weight:700}
.bar .lvl{font-size:.85rem;color:var(--muted)}
.scaletrack{position:relative;height:10px;background:var(--line);border-radius:5px}
.scaletrack .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.scaletrack .zone{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bg)}
.bar .desc{font-size:.92rem;color:var(--muted)}
.riasec{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.rcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.rcol .colbox{width:100%;height:120px;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.rcol .colfill{width:100%;background:var(--line)}
.rcol.top .colfill{background:var(--mark)}
.rcol .letter{font-family:var(--display);font-weight:700;font-size:1.3rem}
.rcol.top .letter{color:var(--mark)}
.rcol .rname{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.2}
.code{display:inline-flex;gap:4px;font-family:var(--mono);background:var(--mark-soft);color:var(--ink);padding:2px 10px;border-radius:6px}

.path{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px}
.path.primary{border:2px solid var(--accent)}
.pathhead{display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2>div{min-width:0;display:flex;flex-direction:column;gap:8px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.roles{display:flex;flex-direction:column;gap:10px}
.role{border-left:3px solid var(--mark);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.role.second{border-left-color:var(--line)}
.role .rh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.role b{font-family:var(--display);font-size:1.02rem}
.role .fit{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.role span.w{font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.chip.req{border-color:var(--accent);color:var(--accent);font-weight:700}
.warn{font-size:.85rem;color:var(--muted)}

.offers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.offer{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--bg)}
.offer+.offer{border-top:1px solid var(--line)}
.offer .oh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.offer .who{font-weight:700}
.offer .who span{font-weight:400;color:var(--muted)}
.offer p{font-size:.92rem}
.offer .src{font-size:.82rem}
.st{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
.st.v{background:var(--accent);color:var(--bg)}
.st.p{background:var(--accent-soft);color:var(--accent)}
.st.o{background:var(--mark-soft);color:var(--ink)}
.st.x{background:transparent;color:var(--muted);border:1px solid var(--line)}

details.method{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
details.method summary{cursor:pointer;font-weight:700}
details.method[open] summary{margin-bottom:10px}
details.method .mbody{display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.formula{font-family:var(--mono);font-size:.85rem;background:var(--bg);padding:8px 10px;border-radius:6px;overflow-x:auto}

/* subjects */
.stage2{display:flex;flex-direction:column;gap:16px;border-top:3px solid var(--mark);padding-top:18px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.subj b{font-family:var(--display);font-size:1rem;line-height:1.2}
.subj small{font-size:.75rem;color:var(--muted)}
.subj.on{border-color:var(--accent);border-width:2px}
.subj.on:hover{background:var(--accent-soft)}
.subj.on small{color:var(--accent);font-weight:700}
.subj:disabled{cursor:not-allowed;opacity:.55;background:var(--bg)}
.subj.rec{border:2.5px solid var(--mark);box-shadow:inset 0 0 0 1px var(--mark-soft)}
.subj.rec:disabled{opacity:.8}
.subj .rectag{align-self:flex-start;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mark)}
.legend{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;border:2.5px solid var(--mark)}

.placeholder{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:32px 24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.copyfallback{width:100%;min-height:160px;font-family:var(--mono);font-size:.8rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
hr{border:0;border-top:1px solid var(--line);margin:0}

@media (max-width:560px){
  .stages{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .qcard{padding:22px 16px}
  .scale{gap:5px}
  .opt .l{font-size:.64rem}
  .rcol .rname{display:none}
  .path{padding:18px}
  .subjects{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function score(a){
  const t={EX:0,UG:0,SU:0,ST:0,OT:0}, r={R:0,I:0,A:0,S:0,E:0,C:0};
  Q.forEach((q,i)=>{const v=q.r?6-a[i]:a[i]; (q.k in t?t:r)[q.k]+=v});
  return {t,r};
}
function pairKey(x,y){return [x,y].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).join("")}
function pickPaths(r){
  const sorted = ORDER.slice().sort((a,b)=>r[b]-r[a]||ORDER.indexOf(a)-ORDER.indexOf(b));
  const max = r[sorted[0]], top = sorted.filter(k=>r[k]===max);
  let pairs=[];
  if(top.length>=2){for(let i=0;i<top.length;i++)for(let j=i+1;j<top.length;j++)pairs.push([top[i],top[j]])}
  else{const s2=r[sorted[1]];sorted.slice(1).filter(k=>r[k]===s2).forEach(k=>pairs.push([top[0],k]))}
  const out=[];
  pairs.forEach(([a,b])=>{const p=PAIRS[pairKey(a,b)];if(!out.find(o=>o.id===p))out.push({id:p,code:a+b})});
  /* Plan B: gdy remis nie dał drugiej ścieżki, bierzemy następną parę liter
     o najwyższej sumie wyników, która prowadzi do innej ścieżki. */
  if(out.length<2){
    const cand=[];
    for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){const a=ORDER[i],b=ORDER[j];cand.push({a,b,s:r[a]+r[b],hasTop:a===sorted[0]||b===sorted[0]})}
    cand.sort((x,y)=>y.s-x.s||(y.hasTop-x.hasTop));
    const alt=cand.find(c=>PAIRS[pairKey(c.a,c.b)]!==out[0].id);
    const [a,b]=r[alt.a]>=r[alt.b]?[alt.a,alt.b]:[alt.b,alt.a];
    out.push({id:PAIRS[pairKey(a,b)],code:a+b});
  }
  return {paths:out.slice(0,2), topLetters:[...new Set(pairs.flat())]};
}
/* Dopasowanie roli: średnia ważona odchyleń cech od środka skali (6), w przedziale −4..+4,
   przeliczona na 0–100%. */
function rankRoles(path,t){
  return path.roles.map(role=>{
    let s=0,sw=0;const why=[];
    for(const k in role.w){const w=role.w[k];s+=w*(t[k]-6);sw+=Math.abs(w);
      if(w>0&&t[k]>=7)why.push("wysoka "+TRAITS[k].name.toLowerCase());
      if(w<0&&t[k]<=5)why.push("niższa "+TRAITS[k].name.toLowerCase());}
    const fit=s/sw;
    return {...role,fit,pct:Math.round((fit+4)/8*100),why};
  }).sort((a,b)=>b.fit-a.fit);
}

            <div class="oh"><span class="who">${o.u} <span>· ${o.k}</span></span><span class="st ${o.s}">${STATUS[o.s]}</span></div>
            <p>${o.m}</p>
            ${o.src?`<a class="src" href="${o.src}" target="_blank" rel="noopener">Źródło</a>`:""}
          </div>`).join("")}</div>
      </div>
    </article>`}).join("");

  app.innerHTML=`
  <header class="section">
    <span class="eyebrow">${isSample?"Przykładowy wynik (dane demonstracyjne)":"Etap 1 · Twój wynik"}</span>
    <h1>${PATHS[paths[0].id].name}</h1>
    <p>Twój kod zainteresowań to <span class="code">${code}</span>. Plan A to ścieżka najlepiej dopasowana do Twoich zainteresowań. Plan B to ${PATHS[paths[1].id].name.toLowerCase()}: druga w kolejności, warta rozważenia równolegle.</p>
    ${maxR<=5?'<p class="note">Wszystkie Twoje zainteresowania wyszły nisko, więc ścieżka jest mało wyrazista. Warto wrócić do testu za jakiś czas albo porozmawiać z doradcą.</p>':""}
  </header>
  <section class="section">
    <h2>Zainteresowania</h2>
    <div class="riasec">${cols}</div>
    <p class="muted" style="font-size:.9rem">${topLetters.map(k=>`<b>${k} – ${RIASEC[k].name}:</b> ${RIASEC[k].d}`).join(". ")}.</p>
  </section>
  ${pathCards}
  <section class="section">
    <h2>Osobowość</h2>
    <div class="bars">${traitBars}</div>
  </section>
  <details class="method" id="method">
    <summary>Jak liczymy wynik</summary>
    <div class="mbody">
      <p><b>Plan A</b> wynika z dwóch najwyższych wyników zainteresowań (model RIASEC Hollanda). Każda para liter ma przypisaną jedną ścieżkę. <b>Plan B</b> to następna para liter o najwyższej sumie wyników, która prowadzi do innej ścieżki. Przy remisie Plan B pochodzi z pary remisowej.</p>
      <p><b>Rola w ścieżce</b> wynika z osobowości (Wielka Piątka). Każda rola ma wagi cech. Dopasowanie to średnia ważona odchyleń Twoich cech od środka skali:</p>
      <div class="formula">dopasowanie = Σ waga × (cecha − 6) / Σ |waga|  →  przeliczone na 0–100%</div>
      <p>Dzięki dzieleniu przez sumę wag rola opisana trzema cechami nie ma przewagi nad rolą opisaną dwiema. Wagi oparliśmy na badaniach: sumienność sprzyja wynikom w prawie każdym zawodzie, a ekstrawersja pomaga zwłaszcza w sprzedaży i zarządzaniu (Barrick i Mount, 1991). Wagę ekstrawersji w sprzedaży obniżyliśmy, bo najlepsi sprzedawcy to często ambiwertycy, a nie skrajni ekstrawertycy (Grant, 2013). Wagi są założeniem eksperckim i zostaną dostrojone po pilotażu.</p>
    </div>
  </details>
  <section class="stage2">
    <span class="eyebrow">Etap 2</span>
    <h2>Diagnoza przedmiotowa</h2>
    <p class="muted">Wybierz przedmiot maturalny, z którego chcesz sprawdzić swój stan wiedzy.</p>
    <span class="legend"><i></i> rekomendowany dla Twojego Planu A lub B</span>
    ${subjectGrid(relevant)}
  </section>
  <hr>
  <p class="warn">Wymagania rekrutacyjne sprawdziliśmy w uchwałach uczelni na rok 2027/28 tam, gdzie były dostępne. Pozycje oznaczone „Zasady 2026/27” lub „Do sprawdzenia” wymagają potwierdzenia. Wynik to punkt wyjścia do rozmowy z doradcą zawodowym, nie diagnoza.</p>
  <div class="row">
    <button class="btn" id="copy">Kopiuj wynik</button>
    <button class="btn ghost" id="again">${isSample?"Zrób własny test":"Zrób test ponownie"}</button>
    <span id="copymsg" class="muted" role="status"></span>
  </div>
  <div id="fallback"></div>`;

  bindSubjects();
  document.getElementById("again").onclick=()=>{isSample=false;answers=Array(Q.length).fill(null);save();idx=0;go("quiz")};
  document.getElementById("copy").onclick=()=>{
    const txt=summary(t,r,paths,code);
    const msg=document.getElementById("copymsg");
    const fb=()=>{document.getElementById("fallback").innerHTML=`<textarea class="copyfallback" id="fbt" readonly>${esc(txt)}</textarea>`;const ta=document.getElementById("fbt");ta.focus();ta.select();msg.textContent="Zaznaczono tekst. Skopiuj go skrótem klawiszowym."};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Skopiowano"},fb)}catch(e){fb()}
  };
  from="result";
}

function renderSubjects(){
  app.innerHTML=`
  <section class="section">
    <span class="eyebrow">Etap 2</span>
    <h1>Diagnoza przedmiotowa</h1>
    <p>Wybierz przedmiot maturalny, z którego chcesz sprawdzić swój stan wiedzy. Na razie dostępna jest matematyka. Kolejne przedmioty dodamy wkrótce.</p>
    ${subjectGrid([])}
    <div class="row">
      <button class="btn ghost" id="toTest">Jednak rozwiąż test diagnostyczny</button>
      <button class="btn link" id="toIntro">Wróć na początek</button>
    </div>
  </section>`;
  bindSubjects();
  document.getElementById("toTest").onclick=()=>{isSample=false;idx=Math.max(0,answers.indexOf(null));go("quiz")};
  document.getElementById("toIntro").onclick=()=>go("intro");
  from="subjects";
}

function renderSubject(){
  const s=SUBJECTS.find(x=>x.id===subject);
  app.innerHTML=`
  <section class="section">
    <span class="eyebrow">Etap 2 · Diagnoza przedmiotowa</span>
    <h1>${s.n}</h1>
    <div class="placeholder" id="subject-module" data-subject="${s.id}">
      <h3>Moduł diagnozy w przygotowaniu</h3>
      <p class="muted">Tutaj pojawi się test sprawdzający stan wiedzy z przedmiotu ${s.n.toLowerCase()}.</p>
    </div>
    <div class="row">
      <button class="btn ghost" id="backSubj">${from==="result"?"Wróć do wyniku":"Wróć do listy przedmiotów"}</button>
    </div>
  </section>`;
  document.getElementById("backSubj").onclick=()=>go(from==="result"?"result":"subjects");
}

function summary(t,r,paths,code){
  const L=[];
  L.push("KOMPAS MATURZYSTY – wynik etapu 1");
  L.push("Kod zainteresowań: "+code);
  L.push("Zainteresowania: "+ORDER.map(k=>`${k} ${r[k]}`).join(", "));
  L.push("Osobowość: "+Object.keys(TRAITS).map(k=>`${TRAITS[k].name} ${t[k]}/10 (${LVL[lvlIdx(t[k])]})`).join("; "));
  paths.forEach((p,i)=>{const P=PATHS[p.id],ro=rankRoles(P,t);
    L.push("");L.push((i===0?"Plan A (ścieżka główna): ":"Plan B (ścieżka alternatywna): ")+P.name);
    L.push(`Rola: ${ro[0].n} (${ro[0].pct}%), druga opcja: ${ro[1].n} (${ro[1].pct}%)`);
    L.push("Kierunki: "+P.kierunki.join(", "));
    L.push("Matura: "+[...P.req,...P.opt].join(", "));
    P.oferty.forEach(o=>L.push(`- ${o.u}, ${o.k} [${STATUS[o.s]}]: ${o.m}`));});
  return L.join("\n");
}
render();
</script>
