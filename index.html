function score(a){
  const t={EX:0,UG:0,SU:0,ST:0,OT:0}, r={R:0,I:0,A:0,S:0,E:0,C:0};
  Q.forEach((q,i)=>{const v=q.r?6-a[i]:a[i]; (q.k in t?t:r)[q.k]+=v});
  return {t,r};
}
function pairKey(x,y){return [x,y].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).join("")}
function pickPaths(r){
  const sorted = ORDER.slice().sort((a,b)=>r[b]-r[a]||ORDER.indexOf(a)-ORDER.indexOf(b));
  const max = r[sorted[0]], top = sorted.filter(k=>r[k]===max);
  let pairs=[];
  if(top.length>=2){for(let i=0;i<top.length;i++)for(let j=i+1;j<top.length;j++)pairs.push([top[i],top[j]])}
  else{const s2=r[sorted[1]];sorted.slice(1).filter(k=>r[k]===s2).forEach(k=>pairs.push([top[0],k]))}
  const out=[];
  pairs.forEach(([a,b])=>{const p=PAIRS[pairKey(a,b)];if(!out.find(o=>o.id===p))out.push({id:p,code:a+b})});
  /* Plan B: gdy remis nie dał drugiej ścieżki, bierzemy następną parę liter
     o najwyższej sumie wyników, która prowadzi do innej ścieżki. */
  if(out.length<2){
    const cand=[];
    for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){const a=ORDER[i],b=ORDER[j];cand.push({a,b,s:r[a]+r[b],hasTop:a===sorted[0]||b===sorted[0]})}
    cand.sort((x,y)=>y.s-x.s||(y.hasTop-x.hasTop));
    const alt=cand.find(c=>PAIRS[pairKey(c.a,c.b)]!==out[0].id);
    const [a,b]=r[alt.a]>=r[alt.b]?[alt.a,alt.b]:[alt.b,alt.a];
    out.push({id:PAIRS[pairKey(a,b)],code:a+b});
  }
  return {paths:out.slice(0,2), topLetters:[...new Set(pairs.flat())]};
}
/* Dopasowanie roli: średnia ważona odchyleń cech od środka skali (6), w przedziale −4..+4,
   przeliczona na 0–100%. */
function rankRoles(path,t){
  return path.roles.map(role=>{
    let s=0,sw=0;const why=[];
    for(const k in role.w){const w=role.w[k];s+=w*(t[k]-6);sw+=Math.abs(w);
      if(w>0&&t[k]>=7)why.push("wysoka "+TRAITS[k].name.toLowerCase());
      if(w<0&&t[k]<=5)why.push("niższa "+TRAITS[k].name.toLowerCase());}
    const fit=s/sw;
    return {...role,fit,pct:Math.round((fit+4)/8*100),why};
  }).sort((a,b)=>b.fit-a.fit);
}


/* ===================== WIDOKI ===================== */
const FRIENDLY = {
  R:"technika i praca rękami", I:"analiza i rozwiązywanie problemów", A:"tworzenie i nowe pomysły",
  S:"pomaganie ludziom", E:"przekonywanie i kierowanie", C:"porządek i praca z danymi"
};
const ANSWERS = ["Zdecydowanie nie","Raczej nie","Nie wiem","Raczej tak","Zdecydowanie tak"];

let answers = load() || Array(Q.length).fill(null);
let idx = 0, isSample = false, subject = null, from = "start", plan = 0, busy = false;

function load(){try{const a=JSON.parse(localStorage.getItem("maturalni-answers"));return Array.isArray(a)&&a.length===Q.length?a:null}catch(e){return null}}
function save(){try{localStorage.setItem("maturalni-answers",JSON.stringify(answers))}catch(e){}}
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lvlIdx = v => v<=4?0:v<=7?1:2;
const LVL = ["niska","średnia","wysoka"];
const $ = id => document.getElementById(id);

/* Kompas korzysta ze wspólnego routera aplikacji (app/nauka.js). */
const K_MAP = {start:"kompas", quiz:"kompas-test", result:"kompas-wynik", subjects:"przedmioty"};
function go(s){Nauka.go(K_MAP[s]||s)}
function render(){Nauka.render()}
function startTest(){isSample=false;idx=answers.includes(null)?answers.indexOf(null):0;if(!answers.includes(null)){go("result")}else go("quiz")}

/* ---------- start ---------- */
function viewStart(){
  const n = answers.filter(v=>v!==null).length;
  const resume = n>0 && n<Q.length, done = n===Q.length;
  const glowny = done?"Zobacz swój wynik":resume?`Kontynuuj (pytanie ${n+1} z ${Q.length})`:"Zaczynamy";
  app.innerHTML=`
  <span class="eyebrow">Krok 1 · Diagnoza</span>
  <h1>Kto Ty jesteś i dokąd chcesz iść?</h1>
  <p class="lead">22 krótkie pytania o Ciebie, ok. 5 minut. Dostajesz pasujące kierunki studiów i przedmioty do zdawania na maturze.</p>
  <p class="note">Nie ma dobrych ani złych odpowiedzi. Wynik to podpowiedź na start, nie wyrok.</p>
  ${Nauka.duo('go', glowny, n?'reset':'skip', n?'Zacznij od nowa':'Pomiń, przejdź do testu diagnozującego')}`;
  $("go").onclick=startTest;
  if($("skip"))$("skip").onclick=()=>Nauka.startPrzedmiot("mat");
  if($("reset"))$("reset").onclick=()=>{answers=Array(Q.length).fill(null);save();startTest()};
}

/* ---------- pytania ---------- */
function viewQuiz(){
  const q=Q[idx], partA=idx<10;
  const text = partA ? q.t : q.t.charAt(0).toUpperCase()+q.t.slice(1)+".";
  app.innerHTML=`
  <div class="stack" style="gap:8px">
    <div class="qtop">
      <button class="qback" id="back">← ${idx===0?"Start":"Wstecz"}</button>
      <span class="qcount">Pytanie ${idx+1} z ${Q.length} · <b style="color:var(--ink)">${Nauka.zacheta(idx,Q.length)}</b></span>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${idx}" aria-label="Postęp testu"><i style="width:${idx/Q.length*100}%"></i></div>
  </div>
  <span class="eyebrow">${partA?"O Tobie":"Czy to coś dla Ciebie?"}</span>
  <h2 class="qtext" id="qt">${esc(text)}</h2>
  <div class="answers" role="radiogroup" aria-labelledby="qt">
    ${ANSWERS.map((l,i)=>`<button class="ans" role="radio" id="a${i+1}" data-v="${i+1}" aria-checked="${answers[idx]===i+1}"><span class="dot"></span>${l}</button>`).join("")}
  </div>
  <p class="hint">Na komputerze możesz odpowiadać klawiszami 1–5.</p>`;
  app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.v));
  $("back").onclick=back;
}
function answer(v){
  if(busy)return;busy=true;
  answers[idx]=v;save();
  app.querySelectorAll(".ans").forEach(b=>b.setAttribute("aria-checked",+b.dataset.v===v));
  setTimeout(()=>{busy=false;
    if(idx<Q.length-1){idx++;render();const h=$("qt");h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
    else{isSample=false;plan=0;go("result")}
  },180);
}
function back(){if(idx===0)go("start");else{idx--;render()}}
document.addEventListener("keydown",e=>{
  if(Nauka.trasa()[0]!=="kompas-test"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-5]$/.test(e.key)){e.preventDefault();answer(+e.key)}
  else if(e.key==="ArrowLeft"){e.preventDefault();back()}
});

/* ---------- wynik ---------- */
function subjectGrid(rec){
  return `<div class="subjects">${SUBJECTS.map(s=>{const r=rec.includes(s.id);return `
    <button class="subj ${s.active?"on":""} ${r?"rec":""}" data-id="${s.id}" ${s.active?"":"disabled"} aria-label="${s.n}${r?", rekomendowany":""}${s.active?"":", wkrótce"}">
      ${r?'<span class="rectag">Rekomendowany</span>':""}
      <b>${s.n}</b><small>${s.active?"Sprawdź wiedzę →":"Wkrótce"}</small>
    </button>`}).join("")}</div>`;
}
function bindSubjects(){app.querySelectorAll(".subj.on").forEach(b=>b.onclick=()=>{subject=b.dataset.id;Nauka.startPrzedmiot(subject)})}

function planCard(p,t){
  const P=PATHS[p.id], roles=rankRoles(P,t), top=roles[0], alt=roles[1];
  const why=w=>w.length?"Pasuje do Twojego profilu: "+w.join(", ")+".":"Najbliższe dopasowanie przy Twoim profilu.";
  return `
  <div class="card" id="plan-panel" role="tabpanel">
    <p class="muted">${P.opis}</p>
    <div class="stack" style="gap:8px">
      <h3>Rola, która do Ciebie pasuje</h3>
      <div class="role"><b>${top.n}</b><span class="muted small">${why(top.why)}</span></div>
      <p class="small muted">Inna opcja: <b style="color:var(--ink)">${alt.n}</b></p>
    </div>
    <div class="stack" style="gap:8px">
      <h3>Kierunki studiów</h3>
      <div class="chips">${P.kierunki.map(k=>`<span class="chip">${k}</span>`).join("")}</div>
    </div>
    <div class="stack" style="gap:8px">
      <h3>Co zdawać na maturze</h3>
      <div class="chips">${P.req.map(s=>`<span class="chip req">${s}</span>`).join("")}${P.opt.map(s=>`<span class="chip">${s}</span>`).join("")}</div>
      <p class="small muted">${P.req.length?"Pogrubione: najczęściej wymagane. Reszta: do wyboru, zależnie od uczelni.":"Do wyboru, zależnie od uczelni."}</p>
    </div>
    <div class="stack" style="gap:8px">
      <h3>Gdzie studiować</h3>
      <div class="offers">${P.oferty.map(o=>`
        <details class="offer"><summary><span class="who"><b>${o.u}</b><span>${o.k}</span></span></summary>
          <div class="body"><span class="st ${o.s}">${STATUS[o.s]}</span><p>${o.m}</p>${o.src?`<a href="${o.src}" target="_blank" rel="noopener">Zobacz źródło</a>`:""}</div>
        </details>`).join("")}</div>
      <p class="small muted">Kliknij uczelnię, żeby zobaczyć zasady rekrutacji.</p>
    </div>
  </div>`;
}

function viewResult(){
  const a=isSample?SAMPLE:answers;
  const {t,r}=score(a);
  const {paths,topLetters}=pickPaths(r);
  const P0=PATHS[paths[0].id];
  const rec=[...new Set(paths.flatMap(p=>PATHS[p.id].key))];
  const topInt=ORDER.slice().sort((x,y)=>r[y]-r[x]).slice(0,2);

  app.innerHTML=`
  <span class="eyebrow">${isSample?"Przykładowy wynik":"Krok 1 · Twój wynik"}</span>
  <h1>Pasuje do Ciebie ścieżka ${P0.name.toLowerCase()}</h1>
  <p>Najbardziej ciekawi Cię ${FRIENDLY[topInt[0]]} oraz ${FRIENDLY[topInt[1]]}. Masz dwa plany do porównania.</p>
  ${Math.max(...Object.values(r))<=5?'<p class="note">Twoje odpowiedzi o zainteresowaniach wyszły dość niskie, więc wynik jest mniej pewny. Warto wrócić do testu za jakiś czas.</p>':""}

  <div class="tabs" role="tablist" aria-label="Plany">
    ${paths.map((p,i)=>`<button class="tab" role="tab" id="tab${i}" aria-selected="${plan===i}" aria-controls="plan-panel"><small>Plan ${i?"B":"A"}</small><span>${PATHS[p.id].name}</span></button>`).join("")}
  </div>
  <div id="plan">${planCard(paths[plan],t)}</div>

  <section class="card">
    <h2>Twój profil</h2>
    <div class="stack" style="gap:8px">
      <h3>Co Cię ciekawi</h3>
      <div class="chips">${ORDER.slice().sort((x,y)=>r[y]-r[x]).slice(0,3).map((k,i)=>`<span class="chip ${i<2?"req":""}">${FRIENDLY[k]}</span>`).join("")}</div>
    </div>
    <div class="stack" style="gap:10px">
      <h3>Jak działasz</h3>
      <ul class="traits">${Object.keys(TRAITS).map(k=>{const li=lvlIdx(t[k]);return `
        <li><div class="th"><b>${TRAITS[k].name}</b><span class="lvl" aria-label="${LVL[li]}">${[0,1,2].map(j=>`<i class="${j<=li?"on":""}"></i>`).join("")}</span></div>
        <span class="muted small">${TRAITS[k].d[li]}</span></li>`}).join("")}</ul>
    </div>
  </section>

  <section class="card">
    <h2>Twoje przedmioty maturalne</h2>
    <div class="chips">${SUBJECTS.filter(x=>rec.includes(x.id)).map(x=>`<span class="chip req">${x.n}${x.active?" · test gotowy":""}</span>`).join("")}</div>
    <p class="small muted">Test diagnozujący sprawdza, jak stoisz z przedmiotem, i daje prognozę wyniku oraz plan nauki. Zaczynamy od matematyki, kolejne przedmioty już wkrótce.</p>
  </section>

  ${Nauka.duo('toMat', 'Dalej: test diagnozujący z matematyki', 'copy', 'Kopiuj wynik')}
  <span id="copymsg" class="muted small center" role="status"></span>
  <div id="fallback"></div>

  <details class="more">
    <summary>Jak liczymy wynik</summary>
    <div class="body">
      <p><b>Plan A</b> wynika z dwóch Twoich najmocniejszych zainteresowań (model RIASEC Hollanda). <b>Plan B</b> to kolejna najmocniejsza para, która prowadzi do innej ścieżki.</p>
      <p><b>Rola</b> wynika z cech osobowości (Wielka Piątka). Każda rola ma wagi cech, a dopasowanie to średnia ważona:</p>
      <div class="formula">dopasowanie = Σ waga × (cecha − 6) / Σ |waga|  →  0–100%</div>
      <p>Wagi oparliśmy na badaniach (Barrick i Mount, 1991; Grant, 2013). To założenia eksperckie, które dostroimy po pilotażu.</p>
      <p>Zasady rekrutacji sprawdziliśmy w uchwałach uczelni na rok 2027/28 tam, gdzie były dostępne. Etykieta przy uczelni mówi, czy dane są aktualne.</p>
      <button class="btn link" id="again" style="align-self:flex-start">${isSample?"Zrób własny test":"Zrób test od nowa"}</button>
    </div>
  </details>`;

  paths.forEach((p,i)=>$("tab"+i).onclick=()=>{plan=i;app.querySelectorAll(".tab").forEach((b,j)=>b.setAttribute("aria-selected",j===i));$("plan").innerHTML=planCard(paths[i],t)});
  bindSubjects();
  $("toMat").onclick=()=>Nauka.startPrzedmiot("mat");
  $("again").onclick=()=>{answers=Array(Q.length).fill(null);save();startTest()};
  $("copy").onclick=()=>{
    const txt=summary(t,r,paths,topLetters.slice(0,3).join("")), msg=$("copymsg");
    const fb=()=>{$("fallback").innerHTML=`<textarea class="copyfallback" id="fbt" readonly>${esc(txt)}</textarea>`;$("fbt").focus();$("fbt").select();msg.textContent="Zaznaczono tekst, skopiuj go skrótem klawiszowym."};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Skopiowano"},fb)}catch(e){fb()}
  };
  from="result";
}

/* ---------- przedmioty ---------- */
function viewSubjects(){
  app.innerHTML=`
  <span class="eyebrow">Krok 2</span>
  <h1>Sprawdź swoją wiedzę z matury</h1>
  <p>Przejdź do testu poziomującego</p>
  ${subjectGrid([])}
  <div class="stack">
    <button class="btn ghost wide" id="toTest">Jednak zrób test predyspozycji</button>
    <button class="btn link" id="toStart" style="align-self:flex-start">← Wróć na start</button>
  </div>`;
  bindSubjects();
  $("toTest").onclick=startTest;
  $("toStart").onclick=()=>Nauka.go("");
  from="subjects";
}
function summary(t,r,paths,code){
  const L=["KOMPAS MATURALNI – wynik","Kod zainteresowań: "+code,
    "Zainteresowania: "+ORDER.map(k=>`${k} ${r[k]}`).join(", "),
    "Osobowość: "+Object.keys(TRAITS).map(k=>`${TRAITS[k].name} ${t[k]}/10`).join("; ")];
  paths.forEach((p,i)=>{const P=PATHS[p.id],ro=rankRoles(P,t);
    L.push("",`Plan ${i?"B":"A"}: ${P.name}`,`Rola: ${ro[0].n} (${ro[0].pct}%), inna opcja: ${ro[1].n} (${ro[1].pct}%)`,
      "Kierunki: "+P.kierunki.join(", "),"Matura: "+[...P.req,...P.opt].join(", "));
    P.oferty.forEach(o=>L.push(`- ${o.u}, ${o.k} [${STATUS[o.s]}]: ${o.m}`));});
  return L.join("\n");
}
Nauka.rejestruj({kompas:viewStart, "kompas-test":viewQuiz, "kompas-wynik":viewResult, przedmioty:viewSubjects}, ["kompas","kompas-test","kompas-wynik","przedmioty"]);
Nauka.kompasStart=startTest;
Nauka.kompasPrzyklad=()=>{isSample=true;plan=0;go("result")};
Nauka.start();
</script>
</body>
</html>
