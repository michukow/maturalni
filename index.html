<html lang="pl">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: jedna wąska kolumna; test to jedno pytanie na ekran z listą odpowiedzi, wynik to karta planu z zakładkami A/B. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#14201C; --muted:#56655F; --line:#D5DFDB;
  --accent:#1E6B57; --accent-soft:#DCEDE6; --mark:#B97A12; --mark-soft:#F6E8CC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E5EDEA; --muted:#93A49D; --line:#2B3934;
  --accent:#55C2A0; --accent-soft:#1B3A31; --mark:#E2A847; --mark-soft:#3A2E17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E5EDEA; --muted:#93A49D; --line:#2B3934;
  --accent:#55C2A0; --accent-soft:#1B3A31; --mark:#E2A847; --mark-soft:#3A2E17; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(24px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.9rem,6.5vw,2.6rem);font-weight:700;letter-spacing:-0.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
h1:focus,h2:focus{outline:none}
p{margin:0;max-width:62ch}
a{color:var(--accent)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:15px 22px;font-weight:700;background:var(--accent);color:var(--bg);min-height:52px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:400;min-height:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.88rem;padding:4px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.chip.req{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}

/* start */
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.facts li{font-size:.88rem;padding:5px 12px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.lead{font-size:1.15rem}

/* pytania */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qback{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:700;min-height:44px}
.qback:disabled{visibility:hidden}
.qcount{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-family:var(--display);font-size:clamp(1.4rem,5vw,1.8rem);font-weight:500;line-height:1.25;text-wrap:balance}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;min-height:56px;transition:border-color .15s, background .15s}
.ans .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.ans:hover{border-color:var(--accent)}
.ans[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ans[aria-checked="true"] .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--accent-soft)}
.hint{font-size:.82rem;color:var(--muted)}

/* wynik */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{border:0;background:transparent;border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:56px;min-width:0}
.tab small{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab span{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.tab[aria-selected="true"]{background:var(--accent);color:var(--bg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.85}
.role{border-left:4px solid var(--mark);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.role b{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.fit{display:inline-block;font-size:.8rem;font-weight:700;color:var(--mark);font-variant-numeric:tabular-nums}
.offers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.offer{background:var(--bg)}
.offer+.offer{border-top:1px solid var(--line)}
.offer summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
.offer summary::-webkit-details-marker{display:none}
.offer summary .who{display:flex;flex-direction:column;min-width:0}
.offer summary .who b{line-height:1.25}
.offer summary .who span{font-size:.85rem;color:var(--muted)}
.offer summary::after{content:"+";font-size:1.3rem;color:var(--muted);flex:none}
.offer[open] summary::after{content:"–"}
.offer .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.st{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.st.v{background:var(--accent);color:var(--bg)}
.st.p{background:var(--accent-soft);color:var(--accent)}
.st.o{background:var(--mark-soft);color:var(--ink)}
.st.x{color:var(--muted);border:1px solid var(--line)}
.traits{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.traits li{display:flex;flex-direction:column;gap:2px}
.traits .th{display:flex;justify-content:space-between;gap:10px;align-items:center}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--accent)}
details.more{border-top:1px solid var(--line);padding-top:14px}
details.more summary{cursor:pointer;font-weight:700;min-height:32px}
details.more .body{display:flex;flex-direction:column;gap:10px;padding-top:10px;font-size:.92rem}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;background:var(--bg);padding:8px 10px;border-radius:6px;overflow-x:auto}

/* przedmioty */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.subj b{font-family:var(--display);line-height:1.2}
.subj small{font-size:.75rem;color:var(--muted)}
.subj.on{border-color:var(--accent);border-width:2px}
.subj.on:hover{background:var(--accent-soft)}
.subj.on small{color:var(--accent);font-weight:700}
.subj:disabled{cursor:not-allowed;opacity:.55;background:var(--bg)}
.subj.rec{border:2.5px solid var(--mark)}
.subj.rec:disabled{opacity:.8}
.subj .rectag{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mark)}
.legend{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;border:2.5px solid var(--mark)}
.placeholder{border:2px dashed var(--line);border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:10px}
.copyfallback{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}

@media (max-width:480px){
  .card{padding:18px}
  .subjects{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ===================== LOGIKA ===================== */
function score(a){
  const t={EX:0,UG:0,SU:0,ST:0,OT:0}, r={R:0,I:0,A:0,S:0,E:0,C:0};
  Q.forEach((q,i)=>{const v=q.r?6-a[i]:a[i]; (q.k in t?t:r)[q.k]+=v});
  return {t,r};
}
function pairKey(x,y){return [x,y].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).join("")}
function pickPaths(r){
  const sorted = ORDER.slice().sort((a,b)=>r[b]-r[a]||ORDER.indexOf(a)-ORDER.indexOf(b));
  const max = r[sorted[0]], top = sorted.filter(k=>r[k]===max);
  let pairs=[];
  if(top.length>=2){for(let i=0;i<top.length;i++)for(let j=i+1;j<top.length;j++)pairs.push([top[i],top[j]])}
  else{const s2=r[sorted[1]];sorted.slice(1).filter(k=>r[k]===s2).forEach(k=>pairs.push([top[0],k]))}
  const out=[];
  pairs.forEach(([a,b])=>{const p=PAIRS[pairKey(a,b)];if(!out.find(o=>o.id===p))out.push({id:p,code:a+b})});
  /* Plan B: gdy remis nie dał drugiej ścieżki, bierzemy następną parę liter
     o najwyższej sumie wyników, która prowadzi do innej ścieżki. */
  if(out.length<2){
    const cand=[];
    for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){const a=ORDER[i],b=ORDER[j];cand.push({a,b,s:r[a]+r[b],hasTop:a===sorted[0]||b===sorted[0]})}
    cand.sort((x,y)=>y.s-x.s||(y.hasTop-x.hasTop));
    const alt=cand.find(c=>PAIRS[pairKey(c.a,c.b)]!==out[0].id);
    const [a,b]=r[alt.a]>=r[alt.b]?[alt.a,alt.b]:[alt.b,alt.a];
    out.push({id:PAIRS[pairKey(a,b)],code:a+b});
  }
  return {paths:out.slice(0,2), topLetters:[...new Set(pairs.flat())]};
}
/* Dopasowanie roli: średnia ważona odchyleń cech od środka skali (6), w przedziale −4..+4,
   przeliczona na 0–100%. */
function rankRoles(path,t){
  return path.roles.map(role=>{
    let s=0,sw=0;const why=[];
    for(const k in role.w){const w=role.w[k];s+=w*(t[k]-6);sw+=Math.abs(w);
      if(w>0&&t[k]>=7)why.push("wysoka "+TRAITS[k].name.toLowerCase());
      if(w<0&&t[k]<=5)why.push("niższa "+TRAITS[k].name.toLowerCase());}
    const fit=s/sw;
    return {...role,fit,pct:Math.round((fit+4)/8*100),why};
  }).sort((a,b)=>b.fit-a.fit);
}

  <section class="stack">
    <span class="eyebrow">Krok 2</span>
    <h2>Sprawdź swoją wiedzę z matury</h2>
    <span class="legend"><i></i> rekomendowane dla Twoich planów</span>
    ${subjectGrid(rec)}
  </section>

  <div class="row">
    <button class="btn ghost" id="copy">Kopiuj wynik</button>
    <button class="btn link" id="again">${isSample?"Zrób własny test":"Zrób test od nowa"}</button>
    <span id="copymsg" class="muted small" role="status"></span>
  </div>
  <div id="fallback"></div>

  <details class="more">
    <summary>Jak liczymy wynik</summary>
    <div class="body">
      <p><b>Plan A</b> wynika z dwóch Twoich najmocniejszych zainteresowań (model RIASEC Hollanda). <b>Plan B</b> to kolejna najmocniejsza para, która prowadzi do innej ścieżki.</p>
      <p><b>Rola</b> wynika z cech osobowości (Wielka Piątka). Każda rola ma wagi cech, a dopasowanie to średnia ważona:</p>
      <div class="formula">dopasowanie = Σ waga × (cecha − 6) / Σ |waga|  →  0–100%</div>
      <p>Wagi oparliśmy na badaniach (Barrick i Mount, 1991; Grant, 2013). To założenia eksperckie, które dostroimy po pilotażu.</p>
      <p>Zasady rekrutacji sprawdziliśmy w uchwałach uczelni na rok 2027/28 tam, gdzie były dostępne. Etykieta przy uczelni mówi, czy dane są aktualne.</p>
    </div>
  </details>`;

  paths.forEach((p,i)=>$("tab"+i).onclick=()=>{plan=i;app.querySelectorAll(".tab").forEach((b,j)=>b.setAttribute("aria-selected",j===i));$("plan").innerHTML=planCard(paths[i],t)});
  bindSubjects();
  $("again").onclick=()=>{answers=Array(Q.length).fill(null);save();startTest()};
  $("copy").onclick=()=>{
    const txt=summary(t,r,paths,topLetters.slice(0,3).join("")), msg=$("copymsg");
    const fb=()=>{$("fallback").innerHTML=`<textarea class="copyfallback" id="fbt" readonly>${esc(txt)}</textarea>`;$("fbt").focus();$("fbt").select();msg.textContent="Zaznaczono tekst, skopiuj go skrótem klawiszowym."};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Skopiowano"},fb)}catch(e){fb()}
  };
  from="result";
}

/* ---------- przedmioty ---------- */
function viewSubjects(){
  app.innerHTML=`
  <span class="eyebrow">Krok 2</span>
  <h1>Sprawdź swoją wiedzę z matury</h1>
  <p>Wybierz przedmiot. Na razie dostępna jest matematyka, kolejne dodamy wkrótce.</p>
  ${subjectGrid([])}
  <div class="stack">
    <button class="btn ghost wide" id="toTest">Jednak zrób test predyspozycji</button>
    <button class="btn link" id="toStart" style="align-self:flex-start">← Wróć na start</button>
  </div>`;
  bindSubjects();
  $("toTest").onclick=startTest;
  $("toStart").onclick=()=>go("start");
  from="subjects";
}
function viewSubject(){
  const s=SUBJECTS.find(x=>x.id===subject);
  app.innerHTML=`
  <button class="btn link" id="backSubj" style="align-self:flex-start">← ${from==="result"?"Wróć do wyniku":"Wróć do przedmiotów"}</button>
  <span class="eyebrow">Diagnoza przedmiotowa</span>
  <h1>${s.n}</h1>
  <div class="placeholder" id="subject-module" data-subject="${s.id}">
    <h3>Moduł w przygotowaniu</h3>
    <p class="muted">Tutaj pojawi się test sprawdzający Twój stan wiedzy.</p>
  </div>`;
  $("backSubj").onclick=()=>go(from==="result"?"result":"subjects");
}

function summary(t,r,paths,code){
  const L=["KOMPAS MATURALNI – wynik","Kod zainteresowań: "+code,
    "Zainteresowania: "+ORDER.map(k=>`${k} ${r[k]}`).join(", "),
    "Osobowość: "+Object.keys(TRAITS).map(k=>`${TRAITS[k].name} ${t[k]}/10`).join("; ")];
  paths.forEach((p,i)=>{const P=PATHS[p.id],ro=rankRoles(P,t);
    L.push("",`Plan ${i?"B":"A"}: ${P.name}`,`Rola: ${ro[0].n} (${ro[0].pct}%), inna opcja: ${ro[1].n} (${ro[1].pct}%)`,
      "Kierunki: "+P.kierunki.join(", "),"Matura: "+[...P.req,...P.opt].join(", "));
    P.oferty.forEach(o=>L.push(`- ${o.u}, ${o.k} [${STATUS[o.s]}]: ${o.m}`));});
  return L.join("\n");
}
render();
</script>
</body>
